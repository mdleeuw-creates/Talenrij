<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talenrij</title>
<meta name="description" content="Learn related languages side by side and grow your vocabulary fast.">
<meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Talenrij">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Be+Vietnam+Pro:wght@500;700&family=Onest:wght@500;700&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* Layout: one column workbench — closeness spectrum + language chips, mode tabs, then a row of 3–4 language lanes per word */
:root{
  --bg:#EEF1EC; --surface:#FBFCFA; --ink:#17211C; --muted:#5E6B64; --line:#D3DAD4;
  --es:#B83A22; --it:#26774A; --pt:#2550A0; --fr:#8A2F6B;
  --zh:#B02A2A; --ja:#6243A3; --ko:#16717F; --vi:#B55A12;
  --de:#8A6410; --sv:#1E62A8; --da:#B3263A; --no:#0E7563; --en:#475569;
  --good:#26774A; --bad:#B83A22; --focus:#6243A3;
  --ca:#9A6B00; --ro:#0F7C8C; --ru:#B02A2A; --pl:#2550A0; --cs:#26774A; --sk:#8A6410; --id:#B83A22; --ms:#1E62A8; --tl:#6243A3;
  --nl:#C2570C; --d1:#1E8A57; --d2:#6E8F12; --d3:#B7790A; --d4:#C2410C;
  --f-display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-vi:"Be Vietnam Pro",system-ui,sans-serif;
  --f-ru:"Onest",system-ui,sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1A221E; --ink:#E7EDE8; --muted:#97A49C; --line:#2C3832;
  --es:#F0805F; --it:#6CC795; --pt:#7FA6EE; --fr:#E58AC4;
  --zh:#EE7A72; --ja:#B39AEC; --ko:#5EC3D0; --vi:#F2A15C;
  --de:#E3BE5C; --sv:#7DB0EE; --da:#F07A88; --no:#5BD0BC; --en:#A9B8CA;
  --nl:#F5A35C; --good:#6CC795; --bad:#F0805F; --focus:#B39AEC; --d1:#4FD18F; --d2:#B5D44A; --d3:#F2C14E; --d4:#F78C5C;
  --ca:#E8C04F; --ro:#5CC6D4; --ru:#EE7A72; --pl:#7FA6EE; --cs:#6CC795; --sk:#E3BE5C; --id:#F0805F; --ms:#7DB0EE; --tl:#B39AEC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A221E; --ink:#E7EDE8; --muted:#97A49C; --line:#2C3832;
  --es:#F0805F; --it:#6CC795; --pt:#7FA6EE; --fr:#E58AC4;
  --zh:#EE7A72; --ja:#B39AEC; --ko:#5EC3D0; --vi:#F2A15C;
  --de:#E3BE5C; --sv:#7DB0EE; --da:#F07A88; --no:#5BD0BC; --en:#A9B8CA;
  --nl:#F5A35C; --good:#6CC795; --bad:#F0805F; --focus:#B39AEC; --d1:#4FD18F; --d2:#B5D44A; --d3:#F2C14E; --d4:#F78C5C;
  --ca:#E8C04F; --ro:#5CC6D4; --ru:#EE7A72; --pl:#7FA6EE; --cs:#6CC795; --sk:#E3BE5C; --id:#F0805F; --ms:#7DB0EE; --tl:#B39AEC; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1;margin:0;letter-spacing:-.02em}
.sub{margin:6px 0 0;color:var(--muted);max-width:56ch}
.stats{font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;text-align:right}
.stats b{color:var(--ink);font-size:1.6rem;display:block;line-height:1}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* picker */
.picker{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px clamp(14px,3vw,24px);display:flex;flex-direction:column;gap:18px}
.eyebrow{font:700 .72rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.scale{display:flex;flex-direction:column;gap:10px}
.scale-line{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;color:var(--muted)}
.scale-line span.track{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 10px);opacity:.35}
.bands{display:grid;grid-template-columns:1fr 2fr 1fr;gap:12px}
.band{display:flex;flex-direction:column;gap:8px;min-width:0}
.band h3{margin:0;font:700 1rem var(--f-display)}
.band p{margin:0;font-size:.82rem;color:var(--muted)}
.band .groups{display:flex;gap:8px;flex-wrap:wrap}
.group{flex:1 1 140px;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);min-width:0}
.group b{font:700 1rem var(--f-display);display:block}
.group small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35;margin-top:2px}
.group .dots{display:flex;gap:3px;margin-top:8px}.group .dots i{width:8px;height:8px;border-radius:50%}
.group[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
@media (max-width:720px){.bands{grid-template-columns:1fr}}
.langbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1.5px solid var(--line);padding-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--c);color:var(--c);background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:.92rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c);color:var(--surface)}
.hint{font-size:.82rem;color:var(--muted);width:100%}
.dist{width:100%;display:flex;flex-direction:column;gap:12px;background:var(--bg);border-radius:14px;padding:14px 16px}
.dist-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.dist-sum{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font:700 .8rem var(--f-body);color:var(--surface);background:var(--d)}
.scale4{display:flex;gap:4px;align-items:center;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.scale4 span{display:inline-flex;align-items:center;gap:5px;margin-right:8px}
.scale4 i{width:12px;height:12px;border-radius:3px;background:var(--d)}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.pair{border-left:6px solid var(--d);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.pair .names{font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pair .names b{color:var(--c)}
.pair .lvl{font-size:.78rem;font-weight:700;color:var(--d)}
.pair p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.chip .dd{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--d);margin-left:7px;vertical-align:middle;box-shadow:0 0 0 1.5px var(--surface)}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink);font-weight:600;font-size:.92rem;padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=search]{width:100%;font:1rem var(--f-body);padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}

/* list rows */
.row{display:grid;grid-template-columns:150px repeat(var(--n),minmax(0,1fr));border-top:1.5px solid var(--line);padding-block:14px;gap:12px;align-items:start}
.row:last-child{border-bottom:1.5px solid var(--line)}
.nl{font-family:var(--f-display);font-weight:700;font-size:1.1rem;min-width:0}
.nl small{display:block;font:400 .78rem var(--f-body);color:var(--muted);margin-top:4px}
.meter{display:flex;gap:3px;margin-top:8px}.meter span{width:16px;height:5px;border-radius:2px;background:var(--line)}.meter span.on{background:var(--ink)}
.cell{min-width:0;border-left:4px solid var(--c);padding-left:10px}
.w{font-family:var(--fw,var(--f-display));font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.cell .w{font-size:1.3rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.r{color:var(--muted);font-size:.85rem}
.lab{font:700 .68rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--c)}
.speak{border:0;background:transparent;color:var(--c);cursor:pointer;padding:2px 4px;border-radius:6px;font-size:.95rem;line-height:1}
.speak:hover{background:color-mix(in srgb,var(--c) 14%,transparent)}
.speak.novoice{opacity:.35}
.speak.saying,.speak-all.saying{background:color-mix(in srgb,var(--c,var(--ink)) 22%,transparent)}
.speak-all{font:700 .8rem var(--f-body);border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.speak-all:hover{border-color:var(--ink)}
.speak-all kbd{font:600 .68rem var(--f-body);opacity:.65;margin-left:4px;border:1px solid currentColor;border-radius:4px;padding:0 3px}
.nl .speak-all{margin-top:8px}
.saybar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:.85rem;color:var(--muted)}
.saybar .note{flex-basis:100%;margin:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:.88rem;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
.tip{grid-column:2 / -1;font-size:.85rem;color:var(--muted);margin-top:-4px;display:flex;flex-direction:column;gap:2px}
.root{display:inline-block;font-family:var(--f-zh);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:4px;color:var(--ink)}
@media (max-width:640px){
  .row{grid-template-columns:repeat(var(--n),minmax(0,1fr))}.nl,.tip{grid-column:1/-1}.cell .w{font-size:1.1rem}
  .n4 .row{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* flash + quiz */
.stage{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:26px clamp(16px,4vw,32px);display:flex;flex-direction:column;gap:20px}
.prompt{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;text-wrap:balance;letter-spacing:-.01em}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.progress div{height:100%;background:var(--ink);transition:width .2s}
.timer{height:3px}.timer div{height:100%;background:var(--focus);width:0}
.lanes,.opts{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
@media (max-width:760px){.n4 .lanes,.n4 .opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.n3 .lanes,.n3 .opts{grid-template-columns:1fr}}
.lane{border-top:4px solid var(--c);padding-top:10px;min-height:92px;min-width:0}
.lane .w{font-size:1.6rem}
.hidden-w{color:transparent;background:var(--line);border-radius:6px;user-select:none}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{font-weight:700;font-size:1rem;padding:12px 18px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.good{border-color:var(--good);color:var(--good)}.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn kbd{font:600 .72rem var(--f-body);opacity:.65;margin-left:6px;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
label.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:16px;cursor:pointer;color:var(--ink);min-width:0}
.opt .w{font-size:1.5rem}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.ask{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.ask em{font-style:normal;color:var(--c)}
.note{font-size:.85rem;color:var(--muted)}
/* vandaag */
.today{gap:22px}
.today-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.zin{display:flex;flex-direction:column;gap:10px}
.zin-label{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.zin-label b{margin-left:6px;padding:2px 10px;border-radius:999px;background:var(--ink);color:var(--surface);font-size:.85rem}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
.ticks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{border-top:3px solid var(--line);padding-top:6px}
.ticks span:nth-child(2){text-align:center}.ticks span:nth-child(3){text-align:right}
.ticks span.on{border-color:var(--ink);color:var(--ink)}
.ticks b{display:block}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--bg);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;min-width:0}
.tile b{font:800 2.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font-weight:700;margin-top:6px}
.tile small{color:var(--muted);font-size:.8rem}
.adj{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.adj li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.adj .arrow{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--line);color:var(--ink)}
.adj li.up .arrow{background:var(--d1);color:var(--surface)}
.adj li.down .arrow{background:var(--d4);color:var(--surface)}
.lock{display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font:700 .72rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1.5px solid currentColor}
.tag.new{color:var(--d1)}.tag.rev{color:var(--muted)}.tag.again{color:var(--d4)}
.stevig{color:var(--d1)}
.btn:disabled,.seg button:disabled{opacity:.45;cursor:not-allowed}
/* thema's */
.themes{display:flex;flex-direction:column;gap:8px}
.theme-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin;scroll-snap-type:x proximity}
.theme{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:132px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.theme b{font:700 .95rem var(--f-display);white-space:nowrap}
.theme small{color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums}
.theme .mini{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.theme .mini i{display:block;height:100%;background:var(--d1)}
.theme[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.theme.done b::after{content:" ✓";color:var(--d1)}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:18px;padding-bottom:6px;font-family:var(--f-display)}
.sec h2{margin:0;font-size:1.25rem;font-weight:800}
.sec span{font:400 .82rem var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.sec+.row{border-top-color:var(--ink)}
.tag.theme-tag{color:var(--muted);border-style:dashed;margin-left:6px}
/* ---------- app shell: mobile tab bar, row summary, onboarding, footer */
body{margin:0;-webkit-tap-highlight-color:transparent}
.rowbtn,.tabbar{display:none}
.foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-top:1.5px solid var(--line);padding-top:16px;font-size:.85rem;color:var(--muted)}
.foot .sp{flex:1}
.linkbtn{font:700 .85rem var(--f-body);border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.linkbtn:hover{border-color:var(--ink)}
.linkbtn[hidden]{display:none}
.offline{display:inline-flex;align-items:center;gap:6px}.offline i{width:8px;height:8px;border-radius:50%;background:var(--d1)}
.offline.off i{background:var(--d3)}
@media (max-width:720px){
  .wrap{padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));gap:16px}
  header{align-items:center;flex-wrap:nowrap}
  h1{font-size:1.9rem}
  .sub{display:none}
  .stats{font-size:.72rem;max-width:18ch;line-height:1.3}.stats b{font-size:1.15rem}
  .rowbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--ink);cursor:pointer;font:inherit}
  .rowbtn b{font:700 1rem var(--f-display)}
  .rowbtn .ls{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.85rem;font-weight:700;flex:1;min-width:0}
  .rowbtn .ls span{color:var(--c)}
  .rowbtn .chev{transition:transform .2s;font-size:.9rem;color:var(--muted)}
  .rowbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .picker{display:none}.picker.open{display:flex}
  .bar{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1.5px solid var(--line);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);font:700 .7rem var(--f-body);padding:6px 2px;border-radius:12px;cursor:pointer;min-height:52px}
  .tabbar svg{width:24px;height:24px}
  .tabbar button[aria-pressed="true"]{color:var(--ink);background:var(--bg)}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .stage{padding:20px 16px;border-radius:16px}
  .btn{padding:14px 18px}
  .actions .btn{flex:1 1 auto}
  .btn kbd,.speak-all kbd{display:none}
}
/* onboarding */
.onb{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:flex;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px))}
.onb-in{width:100%;max-width:560px;display:flex;flex-direction:column;gap:20px;margin:auto 0}

    let fin=false;const end=()=>{if(fin)return;fin=true;sayMark(l,false);if(tok===sayTok&&done)setTimeout(()=>tok===sayTok&&done(),350)};
    u.onstart=()=>sayMark(l,true);u.onend=end;u.onerror=end;sayU=u;speechSynthesis.speak(u)}catch(e){done&&done()}}
function speak(text,lang){stopSay();utter(text,lang,sayTok)}
// play every language of the row one after the other, skipping missing voices
function speakRow(w){if(!w)return;stopSay();const tok=sayTok,q=L.filter(hasVoice);
  if(!q.length){toast(hasTTS?`No voices on this device for this row. ${VOICE_HELP}`:"This browser cannot speak words aloud. Try Chrome, Edge or Safari.");return}
  const next=()=>{if(tok!==sayTok)return;const l=q.shift();if(!l)return;utter(w[l].w,l,tok,next)};next()}
const spk=(w,l)=>`<button class="speak${hasVoice(l)?"":" novoice"}" aria-label="Say in ${LANGS[l].name}" title="${hasVoice(l)?"Pronounce":`No ${LANGS[l].name} voice on this device`}" data-say="${encodeURIComponent(w)}" data-lang="${l}">▶</button>`;
const spkAll=(w,key)=>`<button class="speak-all" data-all="${encodeURIComponent(w.key)}" title="Hear all ${L.length} languages in turn">▶ Hear all${key?"<kbd>P</kbd>":""}</button>`;
const sayBar=w=>`<div class="saybar">${spkAll(w,true)}<label class="chk"><input type="checkbox" data-say-opt="slow" ${say.slow?"checked":""}> Slow</label><label class="chk"><input type="checkbox" data-say-opt="auto" ${say.auto?"checked":""}> Play the row when a card turns</label><p class="note" data-missing>${missingText()}</p></div>`;
const wordByKey=k=>allWords().find(w=>w.key===k);
document.addEventListener("change",e=>{const o=e.target.dataset&&e.target.dataset.sayOpt;if(o){say[o]=e.target.checked;store.set("talenrij-say",say)}});
document.addEventListener("click",e=>{const a=e.target.closest(".speak-all");if(a){e.stopPropagation();speakRow(wordByKey(decodeURIComponent(a.dataset.all)));return}
  const b=e.target.closest(".speak");if(b){e.stopPropagation();speak(decodeURIComponent(b.dataset.say),b.dataset.lang)}});

// helpers
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function kinship(w){
  if(group.data==="cjk"){if(w.root==="—")return 0;const m=w.root.match(/\(([^)]+)\)/);if(!m||m[1]==="all")return 3;
    const codes=m[1].toLowerCase().split("·");const hit=L.filter(l=>codes.includes(l)).length;return hit>=L.length?3:hit>=2?2:1}
  const f=L.map(l=>norm(l==="ru"?w[l].r:w[l].w).replace(/^a /,""));let tot=0,c=0;
  for(let i=0;i<f.length;i++)for(let j=i+1;j<f.length;j++){tot+=1-lev(f[i],f[j])/Math.max(f[i].length,f[j].length);c++}
  const a=tot/c;return a>.8?3:a>.55?2:a>.3?1:0}
const kinLabel=["different","partly related","related","almost the same"];
const meter=n=>`<div class="meter" title="Relatedness">${[1,2,3].map(i=>`<span class="${i<=n?"on":""}"></span>`).join("")}</div>`;
const cvar=l=>`--c:var(--${l});${LANGS[l].font?`--fw:${LANGS[l].font};`:""}`;
function tips(w){const out=[];
  if(w.root&&w.root!=="—")out.push(`<span>Shared characters <span class="root">${w.root}</span></span>`);
  (w.tip||"").split("¦").filter(Boolean).forEach(seg=>{const m=seg.match(/^([a-z]{2}(?:,[a-z]{2})*):(.*)$/);
    if(!m)out.push(`<span>${seg}</span>`);else if(m[1].split(",").some(l=>L.includes(l)))out.push(`<span>${m[2]}</span>`)});
  return out.join("")}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const closePairs=()=>{const out=[];for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++)if(dist(L[i],L[j])[0]===1)out.push([L[i],L[j]]);return out};
const pairName=p=>`${LANGS[p[0]].name}–${LANGS[p[1]].name}`;

// ---------- dagplan
const DIFF={rom:"easy",iber:"easy",romeo:"easy",ger:"easy",scan:"easy",sla:"mid",sino:"hard",aus:"hard"};
// begrippen per dag bij rustig / standaard / intensief, per moeilijkheid en aantal talen
const RANGES={3:{easy:[10,15,20],mid:[8,12,18],hard:[5,7.5,10]},4:{easy:[8,12,15],mid:[6,10,13],hard:[4,6,8]}};
const TABLE={3:[["Relaxed","8–10","±25–30"],["Standard","12–15","±40"],["Intensive","20","±60"]],4:[["Relaxed","6–8","±25–30"],["Standard","10–12","±45"],["Intensive","15","±60"]]};
const interp=(a,s)=>s<=50?a[0]+(a[1]-a[0])*s/50:a[1]+(a[2]-a[1])*(s-50)/50;
const zinIdx=s=>s<34?0:s<67?1:2;
function plan(){
  const n=L.length>=4?4:3, d=DIFF[group.key]||"mid", notes=[];
  const base=interp(RANGES[n][d],prefs.zin); let target=base;
  if(d==="easy")notes.push({dir:"up",t:"Distance",x:"A lot is recognisable for an English speaker, so you are at the high end of the range."});
  else if(d==="mid")notes.push({dir:"eq",t:"Distance",x:"Partly recognisable for an English speaker, so you are in the middle of the range."});
  else notes.push({dir:"down",t:"Distance",x:`Almost everything is new, so it is reduced to ${n===4?"4–8":"5–10"} words.`});
  const close=closePairs(), quizN=close.length?8:0;
  if(close.length){target=Math.max(3,target-2);
    notes.push({dir:"down",t:"Almost the same",x:`${close.map(pairName).join(" and ")} are easy to mix up: 2 words fewer, and every session ends with ${quizN} tell-apart questions.`})}
  const lg=dayLog(), due=dueList().length, load=due+lg.revDone, ratio=load/Math.max(1,target);
  let f=1; if(ratio>=10)f=0; else if(ratio>5)f=(10-ratio)/5;
  if(f<1)notes.push({dir:"down",t:"Reviews",x:f===0?`${load} reviews today: more than 10× your new words. Review first today, no new words.`:`${load} reviews today: more than 5× your new words, so fewer new ones.`});
  else notes.push({dir:"eq",t:"Reviews",x:load?`${load} reviews today: within the limit of 5× your new words.`:"No reviews yet. They come back by themselves once you learn words."});
  target=Math.round(target*f);
  const left=Math.max(0,target-lg.newDone), newToday=Math.min(left,unseen().length);
  const tk=themeKey();
  if(tk!=="all"){const u=unseen().length;
    notes.push({dir:u<left?"down":"eq",t:"Theme",x:u?`New words come from ${themeName(tk).toLowerCase()} (${u} never seen)${u<left?`, so only ${u} new today`:""}. Reviews come from all themes, so your schedule keeps running.`
      :`You have seen every word in ${themeName(tk).toLowerCase()}. Pick another theme for new words; reviews carry on.`})}
  const min=Math.max(1,Math.round((due*6+newToday*2*(n*3+3)+quizN*6)/60));
  return {n,d,base,target,newToday,due,quizN,close,notes,min,lg,left};
}

function renderThemes(){

function renderDist(){
  const pairs=[];for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const [lv,note]=dist(L[i],L[j]);pairs.push({a:L[i],b:L[j],lv,note})}
  pairs.sort((x,y)=>x.lv-y.lv);
  const max=Math.max(...pairs.map(p=>p.lv)),min=Math.min(...pairs.map(p=>p.lv));
  const span=min===max?LEVELS[max].name.toLowerCase():`from ${LEVELS[min].name.toLowerCase()} to ${LEVELS[max].name.toLowerCase()}`;
  document.getElementById("dist").innerHTML=`<div class="dist-head">
      <div class="dist-sum">Distance in your row <span class="badge" style="--d:var(--d${max})">${span}</span></div>
      <div class="scale4">${[1,2,3,4].map(i=>`<span><i style="--d:var(--d${i})"></i>${LEVELS[i].name}</span>`).join("")}</div></div>
    <div class="pairs">${pairs.map(p=>`<div class="pair" style="--d:var(--d${p.lv})">
      <div class="names"><b style="--c:var(--${p.a})">${LANGS[p.a].name}</b>↔<b style="--c:var(--${p.b})">${LANGS[p.b].name}</b></div>

    ${group.pool.length>L.length?`<div class="note">The dot on an unselected language shows how close it is to your row.</div>`:""}`;
}

let sess=null;
function renderToday(){
  if(sess&&sess.phase==="cards")return renderSessCard();

  const m=document.getElementById("main");
  m.innerHTML=`<div class="stage today">

function updatePlan(){

    <div class="tiles">

      <div class="tile"><b>≈ ${nothing&&!p.quizN?0:p.min}</b><span>minutes</span><small>${p.quizN?`including ${p.quizN} tell-apart questions`:"estimated"}</small></div>
    </div>
    <ul class="adj">${p.notes.map(n=>`<li class="${n.dir}"><span class="arrow" aria-hidden="true">${n.dir==="up"?"↑":n.dir==="down"?"↓":"="}</span><div><b>${n.t}</b> ${n.x}</div></li>`).join("")}</ul>
    <p class="note">Base for ${p.n} languages at "${row[idx][0].toLowerCase()}": ${row[idx][1]} words. After adjustments: <b>${p.target}</b> a day.${doneMsg?" "+doneMsg:""}</p>

function startSession(){
  const p=plan();
  const queue=shuffle(dueList()).map(w=>({w,isNew:false})).concat(unseen().slice(0,p.newToday).map(w=>({w,isNew:true})));
  sess={queue,pos:0,revealed:false,lapsed:new Set(),phase:queue.length?"cards":(p.quizN?"quiz":"done"),
    quizLeft:p.quizN,quizTotal:p.quizN,quizOk:0,close:p.close,good:0,bad:0,newCount:p.newToday,revCount:p.due,q:null};
  renderToday();
}
function renderSessCard(){
  const it=sess.queue[sess.pos], total=sess.queue.length;
  document.getElementById("main").innerHTML=`<div class="stage">
    <div class="progress"><div style="width:${sess.pos/total*100}%"></div></div>
    <div class="meta"><span>Card ${sess.pos+1} of ${total}${sess.quizLeft?` · then ${sess.quizLeft} tell-apart questions`:""}</span><span>${sess.good} right · ${sess.bad} not yet</span></div>
    ${cardHTML(it.w,sess.revealed,it.isNew?{cls:"new",txt:"New"}:sess.lapsed.has(it.w.key)?{cls:"again",txt:"Once more"}:{cls:"rev",txt:"Review"})}
    <div class="actions">${sess.revealed?`<button class="btn good" id="yes">Knew it<kbd>J</kbd></button><button class="btn bad" id="no">Not yet<kbd>K</kbd></button>`
      :`<button class="btn primary" id="show">Show the ${L.length} words<kbd>space</kbd></button>`}
      <button class="btn" id="stop">Stop</button></div></div>`;
  if(sess.revealed){document.getElementById("yes").onclick=()=>grade(true);document.getElementById("no").onclick=()=>grade(false)}
  else document.getElementById("show").onclick=sessReveal;
  document.getElementById("stop").onclick=()=>{sess=null;render()};
}
function sessReveal(){if(!sess||sess.phase!=="cards"||sess.revealed)return;sess.revealed=true;renderSessCard();markVoices();if(say.auto)speakRow(sess.queue[sess.pos].w)}
function grade(ok){stopSay();
  const it=sess.queue[sess.pos], nl=it.w.key, c=S()[nl], lg=dayLog();
  if(!it.counted){it.counted=true;it.isNew?lg.newDone++:lg.revDone++}
  if(ok){sess.good++;
    if(sess.lapsed.has(nl))S()[nl]={b:1,due:DAY()+1};
    else{const b=Math.min((c?c.b:0)+1,6);S()[nl]={b,due:DAY()+INT[b]}}}
  else{sess.bad++;S()[nl]={b:1,due:DAY()+1};sess.lapsed.add(nl);sess.queue.push(it)}
  saveSrs();updStats();
  sess.pos++;sess.revealed=false;
  if(sess.pos>=sess.queue.length)sess.phase=sess.quizLeft?"quiz":"done";
  renderToday();
}
function newSessQ(){const pool=allWords().filter(w=>S()[w.key]);const src=pool.length?pool:allWords();
  const w=src[Math.random()*src.length|0], pair=sess.close[Math.random()*sess.close.length|0];
  sess.q={w,target:pair[Math.random()*2|0],order:shuffle(L),done:false}}
function renderSessQuiz(){
  if(!sess.q)newSessQ();

  document.getElementById("main").innerHTML=`<div class="stage">
    <div class="progress"><div style="width:${(n-1)/sess.quizTotal*100}%"></div></div>

function sessPick(l){if(sess.q.done)return;sess.q.done=true;sess.q.picked=l;if(l===sess.q.target)sess.quizOk++;speak(sess.q.w[sess.q.target].w,sess.q.target);renderSessQuiz()}
function sessNext(){sess.quizLeft--;sess.q=null;if(sess.quizLeft<=0)sess.phase="done";renderToday()}
function renderSessDone(){
  const tomorrow=allWords().filter(w=>{const c=S()[w.key];return c&&c.due<=DAY()+1}).length;

}

// ---------- WOORDENRIJ
function renderList(){
  const m=document.getElementById("main");
  m.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px"><input type="search" id="q" placeholder="Search all languages, e.g. 'night' or 'gakkō'" aria-label="Search"><div id="rows"></div></div>`;
  const draw=()=>{const q=norm(document.getElementById("q").value.trim());
    const rows=words().filter(w=>!q||norm([w.en,...L.map(l=>w[l].w+" "+(w[l].r||""))].join(" ")).includes(q));
    const rowHTML=w=>{const k=kinship(w),t=tips(w);return `<div class="row">
      <div class="nl">${w.en}${isStevig(w)?` <span class="stevig" title="Solid">✓</span>`:""}${meter(k)}<small>${kinLabel[k]}</small>${spkAll(w)}</div>
      ${L.map(l=>`<div class="cell" style="${cvar(l)}"><div class="lab">${LANGS[l].name}</div><div class="w">${w[l].w}${spk(w[l].w,l)}</div>${w[l].r?`<div class="r">${w[l].r}</div>`:""}</div>`).join("")}
      ${t?`<div class="tip">${t}</div>`:""}</div>`};
    const secs=themeKey()==="all"?THEMES.map(th=>({th,ws:rows.filter(w=>w.theme===th.key)})).filter(x=>x.ws.length):[{ws:rows}];
    document.getElementById("rows").innerHTML=secs.map(({th,ws})=>(th?`<div class="sec"><h2>${th.name}</h2><span>${ws.filter(isStevig).length} / ${ws.length} solid</span></div>`:"")+ws.map(rowHTML).join("")).join("")||`<p class="note">No words found.</p>`};
  document.getElementById("q").addEventListener("input",()=>{draw();markVoices()});draw();
}

// ---------- VRIJ FLITSEN (telt niet mee in het dagplan)
let deck=[],di=0,revealed=false,auto=false,autoT=null,onlyNew=false,session={good:0,bad:0};
function buildDeck(){deck=shuffle(onlyNew?words().filter(w=>!isStevig(w)):words());di=0;revealed=false;session={good:0,bad:0}}
function renderFlash(){
  clearTimeout(autoT);const m=document.getElementById("main");
  if(!deck.length){m.innerHTML=`<div class="stage"><div class="prompt">Everything in this row is solid.</div><div class="actions"><button class="btn primary" id="reset">Again with all words</button></div></div>`;
    document.getElementById("reset").onclick=()=>{onlyNew=false;buildDeck();renderFlash()};return}
  if(di>=deck.length){m.innerHTML=`<div class="stage"><div class="prompt">Round done</div><p class="meta"><span>${session.good} known · ${session.bad} to practise</span></p><div class="actions"><button class="btn primary" id="again">New round</button></div></div>`;
    document.getElementById("again").onclick=()=>{buildDeck();renderFlash()};return}
  m.innerHTML=`<div class="stage">
    <div class="progress"><div style="width:${di/deck.length*100}%"></div></div>
    <div class="meta"><span>Card ${di+1} of ${deck.length}</span><span>${session.good} known · ${session.bad} practise</span></div>
    ${cardHTML(deck[di],revealed)}
    <div class="timer"><div id="tbar"></div></div>
    <div class="actions">${revealed?`<button class="btn good" id="yes">Knew it<kbd>J</kbd></button><button class="btn bad" id="no">Not yet<kbd>K</kbd></button>`:`<button class="btn primary" id="show">Show the ${L.length} words<kbd>space</kbd></button>`}</div>
    <div class="meta"><label class="chk"><input type="checkbox" id="auto" ${auto?"checked":""}> Turbo: flip automatically after 3 s</label><label class="chk"><input type="checkbox" id="onlynew" ${onlyNew?"checked":""}> Only words that are not solid yet</label></div>
    <p class="note">Free practice does not count towards your daily plan or review schedule.</p>
  </div>`;
  if(!revealed){document.getElementById("show").onclick=reveal;
    if(auto){const b=document.getElementById("tbar");requestAnimationFrame(()=>{b.style.transition="width 3s linear";b.style.width="100%"});autoT=setTimeout(reveal,3000)}}
  else{document.getElementById("yes").onclick=()=>answer(true);document.getElementById("no").onclick=()=>answer(false)}
  document.getElementById("auto").onchange=e=>{auto=e.target.checked;renderFlash()};
  document.getElementById("onlynew").onchange=e=>{onlyNew=e.target.checked;buildDeck();renderFlash()};
}
function reveal(){if(revealed||mode!=="flash")return;revealed=true;renderFlash();markVoices();if(say.auto)speakRow(deck[di])}
function answer(ok){stopSay();const w=deck[di];ok?session.good++:session.bad++;if(!ok)deck.push(w);di++;revealed=false;renderFlash()}

// ---------- RAAD DE TAAL
let qz=null,score={streak:0,best:store.get("talenrij-best",0),ok:0,n:0};
function newQ(){const ws=words();const w=ws[Math.random()*ws.length|0];qz={w,target:L[Math.random()*L.length|0],order:shuffle(L),done:false}}
function renderQuiz(){
  if(!qz)newQ();
  document.getElementById("main").innerHTML=`<div class="stage">
    <div class="meta"><span>Streak ${score.streak} · best ${score.best}</span><span>${score.ok} / ${score.n} right</span></div>
    ${quizHTML(qz,`Clues: ${L.map(l=>LANGS[l].hint).join("; ")}.`)}
    ${qz.done?`<div class="actions"><button class="btn primary" id="next">Next<kbd>space</kbd></button></div>`:""}
  </div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b.dataset.l));
  if(qz.done)document.getElementById("next").onclick=()=>{newQ();renderQuiz()};
}
function pick(l){if(qz.done)return;qz.done=true;qz.picked=l;score.n++;
  if(l===qz.target){score.ok++;score.streak++;if(score.streak>score.best){score.best=score.streak;store.set("talenrij-best",score.best)}}else score.streak=0;
  speak(qz.w[qz.target].w,qz.target);renderQuiz()}

// ---------- shell
function render(){const m=document.getElementById("main");m.style.setProperty("--n",L.length);m.className="n"+L.length;
  renderPicker();renderThemes();updStats();stopSay();({today:renderToday,list:renderList,flash:renderFlash,quiz:renderQuiz})[mode]();markVoices()}
function reset(){buildDeck();qz=null;sess=null;score.streak=0;render()}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.mode===mode));clearTimeout(autoT);render()});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||(e.target.tagName==="BUTTON"&&(e.code==="Space"||e.key==="Enter")))return;
  const k=e.key.toLowerCase();
  if(mode==="today"){
    if(!sess){if(e.code==="Space"&&document.getElementById("start")){e.preventDefault();startSession()}return}
    if(sess.phase==="cards"){if(e.code==="Space"){e.preventDefault();sessReveal()}else if(sess.revealed&&k==="p")speakRow(sess.queue[sess.pos].w);else if(sess.revealed&&k==="j")grade(true);else if(sess.revealed&&k==="k")grade(false)}
    else if(sess.phase==="quiz"&&sess.q){const d=+e.key;if(!sess.q.done&&d>=1&&d<=L.length)sessPick(sess.q.order[d-1]);else if(sess.q.done&&e.code==="Space"){e.preventDefault();sessNext()}}
  }
  if(mode==="flash"){if(e.code==="Space"){e.preventDefault();reveal()}else if(revealed&&k==="p")speakRow(deck[di]);else if(revealed&&k==="j")answer(true);else if(revealed&&k==="k")answer(false)}
  if(mode==="quiz"&&qz){const d=+e.key;if(!qz.done&&d>=1&&d<=L.length)pick(qz.order[d-1]);else if(qz.done&&e.code==="Space"){e.preventDefault();newQ();renderQuiz()}}});
reset();

// ---------- app shell: row toggle, backup, install, offline, onboarding
const rowbtn=document.getElementById("rowbtn"),picker=document.getElementById("picker");
rowbtn.onclick=()=>{const open=!picker.classList.contains("open");picker.classList.toggle("open",open);rowbtn.setAttribute("aria-expanded",open)};

const KEYS=()=>{const out={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("talenrij-"))out[k]=localStorage.getItem(k)}}catch(e){}return out};
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"talenrij",version:1,saved:new Date().toISOString(),data:KEYS()},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`talenrij-progress-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Progress saved as a file. Open it with Restore on another device to carry on there.")};
const importFile=document.getElementById("importFile");
document.getElementById("importBtn").onclick=()=>importFile.click();
importFile.onchange=async()=>{const f=importFile.files[0];importFile.value="";if(!f)return;
  try{const j=JSON.parse(await f.text());if(j.app!=="talenrij"||!j.data)throw 0;
    if(!confirm("Replace the progress on this device with the backup from "+(j.saved||"").slice(0,10)+"?"))return;
    for(const k in KEYS())localStorage.removeItem(k);
    for(const k in j.data)if(k.startsWith("talenrij-"))localStorage.setItem(k,j.data[k]);
    localStorage.setItem("talenrij-onboarded","true");location.reload()}
  catch(e){toast("That file is not a Talenrij backup.")}};

let installEvt=null;const installBtn=document.getElementById("installBtn");
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;installBtn.hidden=false;document.querySelectorAll(".onb-install").forEach(b=>b.hidden=false)});
addEventListener("appinstalled",()=>{installEvt=null;installBtn.hidden=true;toast("Talenrij is on your home screen now.")});
async function doInstall(){if(!installEvt)return false;installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;installBtn.hidden=true;return r.outcome==="accepted"}
installBtn.onclick=doInstall;
if(isIOS&&!standalone()){installBtn.hidden=false;installBtn.onclick=()=>toast("On iPhone or iPad: tap Share, then Add to Home Screen.")}

const net=document.getElementById("netstate");
const updNet=()=>{const on=navigator.onLine;net.classList.toggle("off",!on);net.lastElementChild.textContent=on?"Works offline":"Offline, your progress is still saved"};
addEventListener("online",updNet);addEventListener("offline",updNet);updNet();

if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}

function onboarding(){
  let returning=false;try{returning=localStorage.getItem("talenrij-onboarded")||localStorage.getItem("talenrij-prefs")||Object.values(store.get("talenrij-srs",{})).some(g=>Object.keys(g).length)}catch(e){returning=true}
  if(returning)return;
  const el=document.createElement("div");el.className="onb";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","Welcome to Talenrij");
  document.body.appendChild(el);
  const steps=standalone()?2:3;let step=0;
  const finish=()=>{try{localStorage.setItem("talenrij-onboarded","true")}catch(e){}savePrefs();el.remove();reset()};
  const bar=()=>`<div class="onb-steps">${Array.from({length:steps},(_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`;
  const demo=["es","it","pt"].map(l=>`<div class="lane" style="${cvar(l)}"><div class="lab">${LANGS[l].name}</div><div class="w">${{es:"noche",it:"notte",pt:"noite"}[l]}</div></div>`).join("");
  const draw=()=>{
    if(step===0)el.innerHTML=`<div class="onb-in">${bar()}<h2>Learn three languages at once</h2>
      <p>Every word sits next to its relatives. Spot the pattern once and you remember three words.</p>
      <div class="demo"><div style="grid-column:1/-1" class="ask">night</div>${demo}</div>
      <ul><li>A short plan every day, with new words and reviews.</li><li>Words come back right before you forget them.</li><li>Hear every word, and the whole row in turn.</li></ul>
      <div class="actions"><button class="btn primary" data-go>Get started</button></div></div>`;
    if(step===1)el.innerHTML=`<div class="onb-in">${bar()}<h2>Pick your family</h2><p>How close should the languages be? You can change this any time.</p>
      <div class="glist">${BANDS.map((b,bi)=>`<div class="band-h">${b.name}</div>`+GROUPS.filter(g=>g.band===bi).map(g=>`<button class="group" data-g="${g.key}" aria-pressed="${g===group}"><b>${g.name}</b><small>${g.def.map(l=>LANGS[l].name).join(" · ")}</small><span class="dots">${g.pool.map(l=>`<i style="background:var(--${l})"></i>`).join("")}</span></button>`).join("")).join("")}</div>
      <div class="actions"><button class="btn primary" data-go>${steps===2?"Start learning":"Next"}</button></div></div>`;
    if(step===2)el.innerHTML=`<div class="onb-in">${bar()}<h2>Keep it on your home screen</h2><p>Talenrij works offline once installed, so you can practise on the train or on a plane.</p>
      <div class="howto">${isIOS?`<b>iPhone or iPad</b><span>Tap Share in Safari, then Add to Home Screen.</span>`:`<b>Android or computer</b><span>Tap Install below, or use your browser menu and choose Install app or Add to Home screen.</span>`}</div>
      <div class="actions"><button class="btn onb-install" ${installEvt?"":"hidden"}>Install</button><button class="btn primary" data-go>Start learning</button></div></div>`;
    el.querySelectorAll(".group").forEach(b=>b.onclick=()=>{group=GROUPS.find(g=>g.key===b.dataset.g);L=langs();el.querySelectorAll(".group").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    const inst=el.querySelector(".onb-install");if(inst)inst.onclick=async()=>{await doInstall();finish()};
    el.querySelector("[data-go]").onclick=()=>{step++;step>=steps?finish():draw();el.scrollTop=0};
    el.querySelector("[data-go]").focus()};
  draw();
}
onboarding();
</script>
</body>
